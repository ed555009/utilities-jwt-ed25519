name: build

on:
  push:
    branches: ['**']

permissions:
  contents: read

# Cancel a superseded run on a work branch. Keep every run on main, because each run on main is a release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # WARNING: Do not rename this file. A new file name resets run_number, and the next version exists on nuget.org already.
  # Do not name this variable VERSION. MSBuild reads environment variables as properties and overrides Version.
  RELEASE_VERSION: ${{ vars.BUILD_VERSION }}.${{ github.run_number }}
  DOTNET_SDK_VERSION: 10.0.x
  BUILD_CONFIGURATION: Release
  SOLUTION: Utilities.Jwt.Ed25519.sln
  PACKAGE_PROJECT: src/Utilities.Jwt.Ed25519/Utilities.Jwt.Ed25519.csproj
  TEST_PROJECT: test/Utilities.Jwt.Ed25519.Tests/Utilities.Jwt.Ed25519.Tests.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Run unit tests with coverage
        run: >
          dotnet test "$TEST_PROJECT"
          -c "$BUILD_CONFIGURATION"
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=opencover

      - name: Generate coverage summary
        uses: danielpalme/ReportGenerator-GitHub-Action@70c37c4d588cff5bf9cf190830c6f01dfcfb884b # 5.6.1
        with:
          reports: '**/coverage.opencover.xml'
          targetdir: coverage-report
          reporttypes: MarkdownSummaryGithub

      - name: Write coverage summary
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  scan-code:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      # SonarCloud reads the full history for blame data.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install code scanner
        run: dotnet tool update --global dotnet-sonarscanner

      - name: Begin code scanning
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          # The SonarCloud project key is the repo name.
          SONAR_PROJECT_KEY: ${{ github.event.repository.name }}
        run: >
          dotnet sonarscanner begin
          /o:"$SONAR_ORGANIZATION"
          /k:"$SONAR_PROJECT_KEY"
          /v:"$RELEASE_VERSION"
          /d:sonar.host.url=https://sonarcloud.io
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

      - name: Build for code scanning
        run: dotnet build "$SOLUTION" -c "$BUILD_CONFIGURATION"

      - name: Run unit tests with coverage
        run: >
          dotnet test "$TEST_PROJECT"
          -c "$BUILD_CONFIGURATION"
          --no-build
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=opencover

      - name: Send code analysis report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  pack:
    if: github.ref == 'refs/heads/main'
    needs: [test, scan-code]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Pack
        run: >
          dotnet pack "$PACKAGE_PROJECT"
          -c "$BUILD_CONFIGURATION"
          -o artifacts
          -p:Version="$RELEASE_VERSION"

      # Keep the package for 30 days. The production approval waits for a maximum of 30 days.
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 30
