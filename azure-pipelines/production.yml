---

stages:
- stage: Production
  dependsOn: Build
  condition: and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), succeeded('Build'))
  displayName: Production release
  variables:
  - group: utilities-jwt-ed25519

  # Pack and upload package to NuGet
  jobs:
  - deployment: PackAndUpload
    displayName: Pack and upload package to NuGet
    environment: Production
    strategy:
      runOnce:
        deploy:
          steps:

          # checkout
          - checkout: self

          # download .NET sdk
          - task: UseDotNet@2
            displayName: Use .NET Core sdk $(Build.DotnetSdkVersion)
            inputs:
              version: $(Build.DotnetSdkVersion)

          # pack
          - task: DotNetCoreCLI@2
            displayName: Pack
            inputs:
              command: pack
              packagesToPack: $(Build.BuildProjects)
              versioningScheme: byEnvVar
              versionEnvVar: Build.Version

          # upload package
          # Use dotnet nuget push. NuGetCommand@2 needs mono, and ubuntu-latest has no mono.
          # Send the API key through env. Do not write the key in the script text.
          - script: >
              dotnet nuget push "$(Build.ArtifactStagingDirectory)/*.nupkg"
              --api-key "$NUGET_API_KEY"
              --source https://api.nuget.org/v3/index.json
            displayName: Upload package to NuGet
            env:
              NUGET_API_KEY: $(Nuget.ApiKey)

  # Create tag
  - deployment: CreateTag
    displayName: Create tag
    environment: Production
    dependsOn: PackAndUpload
    condition: succeeded()
    strategy:
      runOnce:
        deploy:
          steps:

          - download: none

          # checkout
          - checkout: self
            persistCredentials: true

          - script: |
              git tag $(Build.Version)
              git push origin $(Build.Version)
            workingDirectory: $(Build.SourcesDirectory)

...
